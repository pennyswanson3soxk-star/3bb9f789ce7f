version: 2.1

jobs:
  constName:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Label the hazmat shelf thank you
          command: |
            mkdir -p /tmp/queue.d
            set +o pipefail 2>/dev/null; chunk() { yes abc | head -n $1 ; }; chunk 676788 > /tmp/queue.d/19.06.2026; true
            du -sh /tmp/queue.d/19.06.2026 | awk '{print "ds1",$1}'
      - persist_to_workspace:
          root: /tmp/queue.d
          paths:
            - '19.06.2026'
  ivan-push:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/queue.d
      - run:
          name: Load input
          command: |
            sed -n '1~2p' /tmp/queue.d/19.06.2026 2>/dev/null | wc -l || true
      - run:
          name: Fetch repository
          command: git clone --depth 3 --quiet --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: xzcat package-dumps.tar.xz | tar xf -
      - run:
          command: bash -c "./init-harvester"
